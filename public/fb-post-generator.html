<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Postów - Super Irek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  body { 
    margin: 0; 
    padding: 40px; 
    background: #e2e2e5; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    font-family: 'Inter', sans-serif; 
  }
  .controls {
    max-width: 1080px;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 30px;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .control-group {
    display: flex;
    gap: 15px;
    align-items: center;
  }
  .control-group label {
    font-weight: bold;
    min-width: 120px;
  }
  .control-group input[type="text"] {
    flex: 1;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
  }
  .char-buttons button {
    padding: 8px 15px;
    font-size: 14px;
    background: #e2e2e5;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
  }
  .char-buttons button.active {
    background: #00704A;
    color: white;
    border-color: #00704A;
  }
  .download-btn {
    padding: 15px 30px; 
    font-size: 20px; 
    background: #00704A; 
    color: white; 
    border: none; 
    border-radius: 8px; 
    cursor: pointer; 
    font-weight: bold;
    align-self: flex-end;
    margin-top: 10px;
  }
  .download-btn:hover { background: #005a3b; }

  /* CAŁKOWICIE NOWY UKŁAD POSTA */
  .post-frame {
    width: 1080px;
    height: 1080px;
    background-color: #F1EBE1; /* Kremowe tło */
    position: relative;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
  }
  
  .header {
    background-color: #00704A;
    padding: 80px 60px;
    text-align: center;
    border-bottom: 12px solid #1E3932;
  }
  
  .title {
    font-family: 'Montserrat', sans-serif;
    font-size: 100px;
    font-weight: 900;
    color: #FFFFFF;
    margin: 0;
    line-height: 1.1;
    letter-spacing: -2px;
  }
  
  .subtitle {
    font-family: 'Montserrat', sans-serif;
    font-size: 50px;
    font-weight: 600;
    color: #D4E9E2; /* Jasna zieleń */
    margin-top: 20px;
  }

  .content-area {
    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    gap: 60px;
  }
  
  .circle-avatar {
    width: 480px;
    height: 480px;
    border-radius: 50%;
    box-shadow: 0 25px 50px rgba(0, 112, 74, 0.25);
    border: 15px solid white;
    object-fit: cover;
    background-color: white;
  }
  
  .contact-box {
    background: #00704A;
    color: white;
    padding: 25px 60px;
    border-radius: 80px;
    font-size: 50px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    box-shadow: 0 15px 30px rgba(0, 112, 74, 0.2);
    display: flex;
    align-items: center;
    gap: 20px;
  }
</style>
</head>
<body>

    function changeChar(imgSrc, btn) {

    function downloadPNG() {
